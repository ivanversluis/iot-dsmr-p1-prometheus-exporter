[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsmr-p1-prometheus-exporter"
version = "0.1.0"
description = "Prometheus exporter for DSMR P1 smart meter telegrams"
requires-python = ">=3.12"
dependencies = [
    "pyserial~=3.5",
    "prometheus-client~=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
